<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Iniciar sesión en H&M Sistema Administrativo">
  <title>Iniciar Sesión — H&M Sistema Administrativo</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="login-page">
  <!-- Enlace de accesibilidad -->
  <a href="#main-content" class="skip-link">Saltar al contenido principal</a>

  <!-- ===================== FONDO CON GRADIENTE ===================== -->
  <div class="login-background" aria-hidden="true">
    <div class="login-shapes">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
    </div>
  </div>

  <!-- ===================== TARJETA DE LOGIN ===================== -->
  <main id="main-content" class="login-container" role="main">
    <div class="login-card">
      <!-- Logo -->
      <div class="login-logo">
        <div class="login-logo-icon" aria-hidden="true">
          <i class="fas fa-store"></i>
        </div>
        <h1 class="login-title">H&M<span class="logo-accent">Admin</span></h1>
        <p class="login-subtitle">Sistema Administrativo</p>
      </div>

      <!-- Formulario de login -->
      <form id="loginForm" class="login-form" novalidate aria-label="Formulario de inicio de sesión">
        <!-- Campo de correo electrónico -->
        <div class="form-group">
          <label for="loginEmail" class="form-label">Correo electrónico</label>
          <div class="input-icon-wrapper">
            <i class="fas fa-envelope input-icon" aria-hidden="true"></i>
            <input
              type="email"
              id="loginEmail"
              name="email"
              class="form-input"
              placeholder="correo@ejemplo.com"
              required
              autocomplete="email"
              data-validation="email"
              aria-label="Ingresa tu correo electrónico"
              aria-required="true"
            >
          </div>
          <span class="form-error" id="emailError" role="alert"></span>
        </div>

        <!-- Campo de contraseña -->
        <div class="form-group">
          <label for="loginPassword" class="form-label">Contraseña</label>
          <div class="input-icon-wrapper">
            <i class="fas fa-lock input-icon" aria-hidden="true"></i>
            <input
              type="password"
              id="loginPassword"
              name="password"
              class="form-input"
              placeholder="Ingresa tu contraseña"
              required
              autocomplete="current-password"
              data-validation="password"
              aria-label="Ingresa tu contraseña"
              aria-required="true"
            >
            <!-- Botón para mostrar/ocultar contraseña -->
            <button
              type="button"
              class="password-toggle"
              id="passwordToggle"
              aria-label="Mostrar u ocultar contraseña"
              tabindex="0"
            >
              <i class="fas fa-eye" id="passwordToggleIcon"></i>
            </button>
          </div>
          <span class="form-error" id="passwordError" role="alert"></span>
        </div>

        <!-- Opciones adicionales -->
        <div class="login-options">
          <label class="checkbox-wrapper" for="rememberMe">
            <input type="checkbox" id="rememberMe" name="remember" aria-label="Recordar sesión">
            <span class="checkbox-custom"></span>
            <span class="checkbox-label">Recordarme</span>
          </label>
          <a href="#" class="forgot-password" id="forgotPasswordLink" aria-label="Recuperar contraseña olvidada">
            ¿Olvidaste tu contraseña?
          </a>
        </div>

        <!-- Botón de envío -->
        <button
          type="submit"
          class="btn btn-primary btn-block"
          id="loginSubmitBtn"
          aria-label="Iniciar sesión en el sistema"
        >
          <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
        </button>
      </form>

      <!-- Enlace de regreso -->
      <div class="login-footer">
        <a href="index.html" class="back-link" aria-label="Volver a la página de inicio">
          <i class="fas fa-arrow-left"></i> Volver al inicio
        </a>
      </div>
    </div>
  </main>

  <!-- Toast Container para notificaciones -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/validaciones.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/app.js"></script>

  <!-- Script específico de login -->
  <script>
    // Manejar el toggle de visibilidad de la contraseña
    document.addEventListener('DOMContentLoaded', function() {
      const toggleBtn = document.getElementById('passwordToggle');
      const passwordInput = document.getElementById('loginPassword');
      const toggleIcon = document.getElementById('passwordToggleIcon');

      if (toggleBtn && passwordInput && toggleIcon) {
        toggleBtn.addEventListener('click', function() {
          const isPassword = passwordInput.type === 'password';
          passwordInput.type = isPassword ? 'text' : 'password';
          toggleIcon.classList.toggle('fa-eye');
          toggleIcon.classList.toggle('fa-eye-slash');
          toggleBtn.setAttribute('aria-label', isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');
        });
      }

      // Manejar envío del formulario
      const loginForm = document.getElementById('loginForm');
      if (loginForm) {
        loginForm.addEventListener('submit', function(e) {
          e.preventDefault();
          // Llamar a la función de validación del archivo validaciones.js
          if (typeof validarLogin === 'function') {
            validarLogin();
          } else {
            // Fallback: redirigir al dashboard
            window.location.href = 'dashboard.html';
          }
        });
      }
    });
  </script>
</body>
</html>
